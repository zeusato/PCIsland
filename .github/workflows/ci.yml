name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend build (needed by tauri::generate_context!)
        run: pnpm build

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests (also regenerates TS bindings)
        working-directory: src-tauri
        run: cargo test

      - name: Bindings are up to date
        shell: bash
        run: git diff --exit-code -- src/lib/ipc/bindings

      - name: Frontend check (svelte-check, eslint, i18n)
        run: pnpm check
      - name: Frontend tests
        run: pnpm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer and portable zip (docs/06-decision-log.md ADR-009)
        shell: pwsh
        run: |
          pnpm tauri build
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $out = "release"
          New-Item -ItemType Directory -Force $out, "$out/portable/data" | Out-Null
          Copy-Item src-tauri/target/release/pcisland.exe "$out/portable/PCisland.exe"
          # Compress-Archive drops empty folders; the marker keeps data\ (portable detection).
          New-Item -ItemType File "$out/portable/data/.portable" | Out-Null
          Copy-Item scripts/README-portable.txt "$out/portable/README-portable.txt"
          Compress-Archive -Path "$out/portable/*" -DestinationPath "$out/PCisland-$ver-portable.zip"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "$out/PCisland-$ver-setup.exe"
          Get-ChildItem $out -File | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Out-File "$($_.FullName).sha256" -Encoding ascii }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/PCisland-*
