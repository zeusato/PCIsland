[package]
name = "pcisland"
version = "0.1.1"
description = "Dynamic Island for Windows"
edition = "2024"
rust-version = "1.85"

[lib]
name = "pcisland_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-dialog = "2.8"
tracing-appender = "0.2"
rodio = "0.23"
chrono = "0.4"
lofty = "0.25"
walkdir = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "blocking"] }
realfft = "3"
tauri-plugin-drag = "2.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Variant",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Win32_System_WinRT",
  "Storage_Streams",
  "Data_Xml_Dom",
  "UI_Notifications",
] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind" # module supervisor relies on catching task panics (docs/02-system-design.md §4)
